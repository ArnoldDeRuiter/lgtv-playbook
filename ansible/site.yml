---
# LG webOS TV (tvtje) — reapply all persistent customizations from the
# 2026-08-21/22 session. Idempotent: safe to rerun any time (e.g. after a
# factory reset + re-root via SlopBro — that one-time rooting step is NOT
# covered here, see ../../slopbro for that).
#
# IMPORTANT — no Python on the TV: the target is a busybox-ash-only embedded
# webOS TV, not a normal Linux box. Standard Ansible modules (copy/template/
# file/etc.) need Python on the *remote* host, so this can't be a normal
# `hosts: tvtje` playbook. Instead everything runs on `hosts: localhost` and
# shells out to `ssh tvtje` / `scp ... tvtje:...` — the `tvtje` alias must
# already exist in ~/.ssh/config (root@192.168.1.120, dedicated key,
# ~/.ssh/id_ed25519_tvtje). No special Ansible collections needed, builtin
# modules only.
#
# Run with: ansible-playbook site.yml

- name: Reapply LG webOS TV (tvtje) customizations
  hosts: localhost
  gather_facts: false
  vars:
    tv_alias: tvtje
    # read from ~/.ssh/config so a DHCP change only needs the alias updated
    tv_ip: >-
      {{ (lookup('pipe', 'ssh -G ' ~ tv_alias) | regex_search('(?m)^hostname (\S+)', '\1'))[0] }}
    glasshouse_repo: "{{ lookup('env', 'HOME') }}/git/personal/glasshouse"
    tv_pubkey_path: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519_tvtje.pub"
    # Home Assistant's key (pikvm-playbook tv_night_mode: night mode, now playing, silent volume)
    tv_authorized_pubkeys:
      - "{{ tv_pubkey_path }}"
      - "{{ playbook_dir }}/files/homeassistant-tv.pub"
    amazoff_patchctl: /media/developer/apps/usr/palm/applications/com.amazoff.patcher/tools/patchctl.sh
    dropbear_bin: /media/developer/apps/usr/palm/services/org.webosbrew.hbchannel.service/bin/dropbear
    initd_dir: /var/lib/webosbrew/init.d
    # Glasshouse config.json keys this playbook owns (dotted paths); everything else stays TV-owned
    glasshouse_config:
      # syslog forwarding to the PiKVM receiver (pikvm-playbook roles/syslog_receiver); kernel runs dmesg every 30 s
      - key: syslog
        value:
          server: 192.168.1.110
          port: 514
          hostname: lgtv
          sources: [system, glasshouse, kernel]
          redact: true
      # Watch time sensors in HA; records what is watched, kept on the TV for 13 months
      - key: history.enabled
        value: true
      # Server Update entity in HA; one GitHub release check a day
      - key: update.check
        value: true

  tasks:
    # --- 1. SSH access -----------------------------------------------------

    - name: Check whether SSH to the TV already works
      ansible.builtin.command:
        cmd: ssh -o BatchMode=yes -o ConnectTimeout=5 {{ tv_alias }} true
      register: ssh_check
      changed_when: false
      failed_when: false

    - name: Bootstrap SSH via telnet failsafe shell (only if SSH isn't reachable yet)
      ansible.builtin.command:
        cmd: "python3 {{ playbook_dir }}/files/telnet_bootstrap.py"
      when: ssh_check.rc != 0
      register: telnet_bootstrap
      changed_when: "'sshd started' in telnet_bootstrap.stdout"

    - name: Give dropbear a moment to come up after telnet bootstrap
      ansible.builtin.pause:
        seconds: 3
      when: ssh_check.rc != 0

    - name: Confirm SSH now works
      ansible.builtin.command:
        cmd: ssh -o BatchMode=yes -o ConnectTimeout=5 {{ tv_alias }} true
      changed_when: false

    # Appends only missing keys: other keys on the TV (e.g. Home Assistant's) must survive a run
    - name: Ensure our pubkeys are in root's authorized_keys
      ansible.builtin.shell: |
        set -e
        PUBKEY=$(cat "{{ item }}")
        REMOTE=$(ssh {{ tv_alias }} 'cat /home/root/.ssh/authorized_keys 2>/dev/null' </dev/null || true)
        if ! printf '%s\n' "$REMOTE" | grep -qxF "$PUBKEY"; then
          ssh {{ tv_alias }} "mkdir -p /home/root/.ssh && chmod 700 /home/root/.ssh && printf '%s\n' '$PUBKEY' >> /home/root/.ssh/authorized_keys && chmod 600 /home/root/.ssh/authorized_keys && chown 0:0 /home/root/.ssh/authorized_keys" </dev/null
          echo CHANGED
        fi
      loop: "{{ tv_authorized_pubkeys }}"
      register: authkey_result
      changed_when: "'CHANGED' in authkey_result.stdout"

    - name: Ensure SSH-enabled flag file exists on the TV
      ansible.builtin.shell: |
        set -e
        if ! ssh {{ tv_alias }} 'test -f /var/luna/preferences/webosbrew_sshd_enabled'; then
          ssh {{ tv_alias }} 'touch /var/luna/preferences/webosbrew_sshd_enabled'
          echo CHANGED
        fi
      register: flag_result
      changed_when: "'CHANGED' in flag_result.stdout"

    - name: Ensure dropbear (sshd) is actually running right now, not just flagged for next boot
      ansible.builtin.shell: |
        set -e
        if ! nc -z -w3 {{ tv_ip }} 22; then
          ssh {{ tv_alias }} 'mkdir -p /var/lib/webosbrew/sshd && setsid {{ dropbear_bin }} -R </dev/null >/dev/null 2>&1 &'
          echo CHANGED
        fi
      register: dropbear_result
      changed_when: "'CHANGED' in dropbear_result.stdout"

    # --- 2. Ensure these boot hooks are absent -----------------------------

    - name: Remove custom home-screen boot hook (tld.my.customhome override turned off for good, see ../homescreen)
      ansible.builtin.shell: |
        set -e
        if ssh {{ tv_alias }} 'test -e {{ initd_dir }}/01-custom-homescreen'; then
          ssh {{ tv_alias }} 'rm -f {{ initd_dir }}/01-custom-homescreen'
          echo CHANGED
        fi
      register: homescreen_hook_result
      changed_when: "'CHANGED' in homescreen_hook_result.stdout"

    - name: Remove sound-mode-fix boot hook (app was fully uninstalled)
      ansible.builtin.shell: |
        set -e
        if ssh {{ tv_alias }} 'test -e {{ initd_dir }}/20-force-sound-mode'; then
          ssh {{ tv_alias }} 'rm -f {{ initd_dir }}/20-force-sound-mode'
          echo CHANGED
        fi
      register: soundfix_result
      changed_when: "'CHANGED' in soundfix_result.stdout"

    - name: Remove broken custom-screensaver boot hook (targets qml/main.qml, which doesn't exist on webOS 10's Flutter screensaver)
      ansible.builtin.shell: |
        set -e
        if ssh {{ tv_alias }} 'test -e {{ initd_dir }}/50-custom-screensaver'; then
          ssh {{ tv_alias }} 'rm -f {{ initd_dir }}/50-custom-screensaver'
          echo CHANGED
        fi
      register: screensaver_result
      changed_when: "'CHANGED' in screensaver_result.stdout"

    # --- 3. AmazOff Prime Video ad-patcher autostart -----------------------

    - name: Check whether AmazOff autostart hook already exists
      ansible.builtin.command:
        cmd: ssh {{ tv_alias }} "test -e {{ initd_dir }}/50-custom-amazoff"
      register: amazoff_hook_check
      changed_when: false
      failed_when: false

    - name: Enable AmazOff autostart
      # patchctl.sh autostart_toggle FLIPS the current state, so this must
      # only run when the hook is currently absent — running it again would
      # turn autostart back off.
      ansible.builtin.command:
        cmd: ssh {{ tv_alias }} "sh {{ amazoff_patchctl }} autostart_toggle"
      when: amazoff_hook_check.rc != 0
      register: amazoff_toggle
      changed_when: "'\"autostart\":true' in amazoff_toggle.stdout"

    - name: Ensure the AmazOff ad-patch service is actually running now, not just enabled for next boot
      ansible.builtin.shell: |
        set -e
        STATUS=$(ssh {{ tv_alias }} 'sh {{ amazoff_patchctl }} status')
        case "$STATUS" in
          *'"service":"running"'*) ;;
          *)
            ssh {{ tv_alias }} 'sh {{ amazoff_patchctl }} start'
            echo CHANGED
            ;;
        esac
      register: amazoff_start
      changed_when: "'CHANGED' in amazoff_start.stdout"

    # --- 4. Login-autofill credentials (F1TV, Family7) ----------------------
    # Optional -- only runs once you've created and encrypted
    # ansible/vault.yml (see vault.yml.example). Deploys a root-only
    # credentials file each app's own loginfill.py daemon reads to
    # autofill (never submit) its login form. Nothing here ever touches
    # Ansible's own logs/output with the real values -- copy uses a local
    # temp file, which is removed again immediately after.

    - name: Check whether the credentials vault exists yet
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/vault.yml"
      register: vault_file

    - name: Load F1TV credentials from the vault
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/vault.yml"
      when: vault_file.stat.exists
      no_log: true

    - name: Write credentials JSON to a local temp file
      ansible.builtin.copy:
        content: |
          {
            "f1tv": {"username": {{ f1tv_username | to_json }}, "password": {{ f1tv_password | to_json }}},
            "family7": {"username": {{ family7_username | to_json }}, "password": {{ family7_password | to_json }}}
          }
        dest: /tmp/tv-credentials.json
        mode: "0600"
      when: vault_file.stat.exists
      no_log: true

    - name: Deploy credentials to the TV, root-only
      ansible.builtin.shell: |
        set -e
        scp -q /tmp/tv-credentials.json {{ tv_alias }}:/var/lib/webosbrew/tv-credentials.json
        ssh {{ tv_alias }} 'chmod 600 /var/lib/webosbrew/tv-credentials.json && chown 0:0 /var/lib/webosbrew/tv-credentials.json'
      when: vault_file.stat.exists
      register: creds_result
      changed_when: true
      no_log: true

    - name: Remove the local plaintext credentials temp file
      ansible.builtin.file:
        path: /tmp/tv-credentials.json
        state: absent
      when: vault_file.stat.exists

    # --- 5. Glasshouse (tvweb): dashboard + MQTT bridge --------------------
    # Installed/updated with Glasshouse's own server/deploy.sh from the local
    # clone, only when the clone's version is newer than the one the TV runs, or
    # the clone has uncommitted server changes (deploy.sh restarts the server, so
    # it must not run on every playbook run). Versions, not build.json commits:
    # the dashboard/HA self-update replaces tvweb.js but leaves build.json stale.
    # deploy.sh calls plain `ssh root@<ip>`, so the wrapper in files/ssh-wrapper
    # adds this TV's key. Deliberately NOT managed here:
    #   - /var/lib/tvweb/config.json (MQTT broker, topics, dashboard settings): the TV
    #     owns it (the dashboard saves into it, deploy.sh never overwrites it) and the
    #     MQTT password lives in pikvm-playbook's vault. See pikvm-playbook docs/mosquitto-tls.md.
    #     Only exceptions: the keys in glasshouse_config, set below.
    #   - Glasshouse Home (LG Home takeover): tried and switched off, it leaves no home
    #     screen until the server is up after boot.
    #   - Restoring ../glasshouse/*.json.vault: done from the dashboard's backup page.

    - name: Check for a local Glasshouse clone
      ansible.builtin.stat:
        path: "{{ glasshouse_repo }}/server/deploy.sh"
      register: glasshouse_deploy_script

    - name: Deploy Glasshouse when the local clone is newer than the TV's server
      when: glasshouse_deploy_script.stat.exists
      block:
        - name: Read the version of the local Glasshouse clone
          ansible.builtin.shell: |
            grep -m1 '^var TVWEB_VERSION' {{ glasshouse_repo }}/server/tvweb.js | sed 's/[^0-9.]//g'
          register: glasshouse_local_version
          changed_when: false

        - name: Check the local clone for uncommitted changes under server/
          ansible.builtin.command:
            cmd: git -C {{ glasshouse_repo }} status --porcelain -- server
          register: glasshouse_local_dirty
          changed_when: false

        - name: Read the version the TV's Glasshouse server runs (empty if not installed)
          ansible.builtin.shell: |
            ssh {{ tv_alias }} "grep -m1 '^var TVWEB_VERSION' /var/lib/tvweb/tvweb.js 2>/dev/null | sed 's/[^0-9.]//g'" </dev/null
          register: glasshouse_tv_version
          changed_when: false

        - name: Decide whether Glasshouse needs (re)deploying
          ansible.builtin.set_fact:
            glasshouse_deploy_needed: >-
              {{ glasshouse_tv_version.stdout | trim == ''
                 or glasshouse_local_version.stdout | trim is version(glasshouse_tv_version.stdout | trim, '>')
                 or glasshouse_local_dirty.stdout | trim != '' }}

        - name: Deploy Glasshouse (first install also adds the dashboard tile; updates leave the home screen alone)
          ansible.builtin.command:
            cmd: bash {{ glasshouse_repo }}/server/deploy.sh {{ tv_ip }}
          environment:
            PATH: "{{ playbook_dir }}/files/ssh-wrapper:{{ lookup('env', 'PATH') }}"
          when: glasshouse_deploy_needed | bool
          register: glasshouse_deploy_result
          changed_when: "'done - open' in glasshouse_deploy_result.stdout"

    - name: Copy the config helper to the TV
      ansible.builtin.command:
        cmd: scp -q {{ playbook_dir }}/files/tvweb-config-set.js {{ tv_alias }}:/tmp/tvweb-config-set.js
      changed_when: false

    - name: Set the Glasshouse config keys this playbook owns
      ansible.builtin.shell: |
        printf '%s' {{ item.value | to_json | quote }} | ssh {{ tv_alias }} 'node /tmp/tvweb-config-set.js {{ item.key }}'
      loop: "{{ glasshouse_config }}"
      loop_control:
        label: "{{ item.key }}"
      register: glasshouse_config_set
      changed_when: "'CHANGED' in glasshouse_config_set.stdout"

    - name: Remove the config helper from the TV
      ansible.builtin.command:
        cmd: ssh {{ tv_alias }} 'rm -f /tmp/tvweb-config-set.js'
      changed_when: false

    - name: Restart Glasshouse so it picks up the changed settings
      ansible.builtin.command:
        cmd: ssh {{ tv_alias }} '/var/lib/tvweb/tvwebctl restart'
      when: glasshouse_config_set is changed

    - name: Report whether Glasshouse has a config.json on the TV (only the glasshouse_config keys are managed here)
      ansible.builtin.command:
        cmd: ssh {{ tv_alias }} 'test -f /var/lib/tvweb/config.json && echo present || echo missing'
      register: glasshouse_config_state
      changed_when: false
      failed_when: false

    - name: Show Glasshouse config state
      ansible.builtin.debug:
        msg: "Glasshouse /var/lib/tvweb/config.json is {{ glasshouse_config_state.stdout | default('unknown') }} (MQTT settings are TV-owned; see pikvm-playbook docs/mosquitto-tls.md)"

    # --- 6. RetroArch USB boot hook: binds USB sticks into the RetroArch jail (its /tmp misses later mounts) ---

    - name: Install or update the RetroArch USB boot hook
      ansible.builtin.shell: |
        set -e
        LOCAL=$(sha256sum {{ playbook_dir }}/files/60-retroarch-usb | cut -d' ' -f1)
        REMOTE=$(ssh {{ tv_alias }} 'sha256sum {{ initd_dir }}/60-retroarch-usb 2>/dev/null' | cut -d' ' -f1)
        if [ "$LOCAL" != "$REMOTE" ]; then
          scp -q {{ playbook_dir }}/files/60-retroarch-usb {{ tv_alias }}:{{ initd_dir }}/60-retroarch-usb
          ssh {{ tv_alias }} 'chmod 755 {{ initd_dir }}/60-retroarch-usb; P=$(cat /tmp/retroarch-usb-bind.pid 2>/dev/null); [ -n "$P" ] && kill "$P" 2>/dev/null; rm -f /tmp/retroarch-usb-bind.pid'
          echo CHANGED
        fi
      register: retroarch_usb_hook
      changed_when: "'CHANGED' in retroarch_usb_hook.stdout"

    - name: Ensure the RetroArch USB bind loop is running now, not just at next boot
      ansible.builtin.command:
        cmd: ssh {{ tv_alias }} '{{ initd_dir }}/60-retroarch-usb'
      changed_when: false
